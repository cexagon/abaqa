<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Lab Rahasia Bu Canni</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--sky:#CFEBFF;--sky2:#9ED5FF;--sun:#FFD23F;--coral:#FF6F61;--mint:#6FE0B2;--lav:#B9A7FF;--ink:#2B2D42;--paper:#fff;--cream:#FFF8E7;--shadow:#2B2D4233;--ok:#3FBF7F}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--sky);font-family:"Fredoka",system-ui,sans-serif;color:var(--ink);padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
  body{display:flex;flex-direction:column;align-items:center;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
  #app{width:100%;max-width:480px;height:100%;display:flex;flex-direction:column}
  .top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px 4px}
  .top .ep{font-weight:600;font-size:14px;background:#fff;border-radius:999px;padding:6px 12px;box-shadow:0 3px 0 var(--shadow);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .top button{border:0;background:#fff;border-radius:999px;width:40px;height:40px;font-size:20px;box-shadow:0 3px 0 var(--shadow);flex:0 0 auto}
  .steps{display:flex;gap:6px;justify-content:center;padding:4px 0 2px}
  .steps span{width:34px;height:8px;border-radius:999px;background:#fff8}
  .steps span.on{background:var(--coral)}.steps span.done{background:var(--ok)}
  .stage{flex:0 0 auto;margin:4px 14px;background:linear-gradient(var(--sky2),var(--sky));border-radius:28px;overflow:hidden;box-shadow:0 6px 0 var(--shadow);position:relative}
  .stage svg{display:block;width:100%;height:auto}
  .panel{flex:1 1 auto;display:flex;flex-direction:column;padding:6px 14px 14px;gap:10px;min-height:0;overflow:auto}
  .bubble{position:relative;background:var(--paper);border-radius:24px;padding:14px 48px 14px 14px;display:flex;gap:12px;align-items:flex-start;box-shadow:0 5px 0 var(--shadow);min-height:96px;flex-shrink:0}
  .bubble .avatar{flex:0 0 64px;width:64px;height:64px}
  .bubble .who{font-size:12px;font-weight:700;color:var(--coral);letter-spacing:.5px;margin-bottom:2px}
  .bubble p{margin:0;font-size:19px;line-height:1.35;font-weight:500}
  .bubble .replay{position:absolute;right:10px;top:10px;border:0;background:var(--cream);width:36px;height:36px;border-radius:50%;font-size:18px;box-shadow:0 3px 0 var(--shadow)}
  .controls{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
  .btn{border:0;font-family:inherit;font-weight:700;font-size:20px;color:#fff;background:var(--coral);padding:14px 26px;border-radius:999px;box-shadow:0 6px 0 #C94F43;cursor:pointer;transition:transform .08s}
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 #C94F43}
  .btn.mint{background:var(--ok);box-shadow:0 6px 0 #2D8F5E}.btn.mint:active{box-shadow:0 2px 0 #2D8F5E}
  .btn.ghost{background:#fff;color:var(--ink);box-shadow:0 6px 0 var(--shadow)}.btn.ghost:active{box-shadow:0 2px 0 var(--shadow)}
  .btn.big{font-size:26px;padding:18px 36px}
  .btn.sq{width:64px;height:64px;padding:0;font-size:28px;border-radius:20px}
  .btn[disabled]{opacity:.4;pointer-events:none}
  .choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
  .choice{border:4px solid #fff;background:#fff;border-radius:22px;padding:8px 4px 10px;text-align:center;font-weight:700;font-size:16px;box-shadow:0 5px 0 var(--shadow);cursor:pointer;transition:transform .1s}
  .choice svg{width:64px;height:64px;display:block;margin:0 auto 4px}
  .choice:active{transform:scale(.95)}
  .choice.picked{border-color:var(--sun);background:var(--cream)}
  .slider-wrap{width:100%;background:#fff;border-radius:22px;padding:10px 16px 6px;box-shadow:0 5px 0 var(--shadow)}
  .slider-wrap label{display:flex;justify-content:space-between;font-weight:700;font-size:14px;color:#777}
  input[type=range]{-webkit-appearance:none;width:100%;height:18px;border-radius:999px;background:linear-gradient(90deg,var(--lav),var(--sun));outline:0;margin:8px 0}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:44px;height:44px;border-radius:50%;background:#fff;border:5px solid var(--coral);box-shadow:0 4px 0 var(--shadow)}
  input[type=range]::-moz-range-thumb{width:44px;height:44px;border-radius:50%;background:#fff;border:5px solid var(--coral)}
  .pulse{animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  .sticker{background:#fff;border-radius:24px;padding:12px;display:flex;gap:12px;align-items:center;box-shadow:0 5px 0 var(--shadow);width:100%}
  .sticker .badge{flex:0 0 72px;width:72px;height:72px;font-size:44px;text-align:center;line-height:72px;background:var(--cream);border-radius:20px}
  .sticker b{display:block;font-size:17px}.sticker span{font-size:15px;line-height:1.3}
  .pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
  @keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
  .confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .confetti i{position:absolute;top:-10px;width:10px;height:14px;border-radius:3px;animation:fall 1.6s linear forwards}
  @keyframes fall{to{transform:translateY(340px) rotate(540deg);opacity:0}}
  .program{display:flex;flex-wrap:wrap;gap:6px;min-height:44px;width:100%;background:#fff;border-radius:18px;padding:8px;box-shadow:0 4px 0 var(--shadow)}
  .program i{font-style:normal;width:38px;height:38px;border-radius:12px;background:var(--cream);display:grid;place-items:center;font-size:22px;border:3px solid var(--sun)}
  .program i.run{background:var(--sun)}
  .pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
  .pair .btn{font-size:22px;padding:16px 10px}
  .shake{animation:shake .4s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  .book{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%}
  .book div{background:#fff;border-radius:18px;text-align:center;padding:8px 2px;font-size:30px;box-shadow:0 4px 0 var(--shadow)}
  .book div small{display:block;font-size:11px;font-weight:700;line-height:1.1;margin-top:2px}
  .book div.off{opacity:.35;filter:grayscale(1)}
</style>
</head>

e1-11", "Luar biasa! Baterainya hampir penuh!": "e1-12", "Bu, sudah malam! Mataharinya tidur. Lampunya mati lagi...": "e1-13", "Kalau malam, bagaimana ya? Ingat tidak, tadi siang listriknya kita simpan di baterai. Coba tekan baterainya!": "e1-14", "Yeay! Nyala! Baterainya menyimpan listrik dari matahari untuk malam hari.": "e1-15", "Panel surya mengubah cahaya matahari menjadi listrik. Baterai menyimpannya, supaya malam hari lampu tetap bisa nyala.": "e1-16", "Lampu jalan di dekat rumahmu, banyak yang pakai panel surya, lho! Coba cari kalau kamu lewat ya. Dan baterai ini, kita simpan untuk rover Mars Pipo.": "e1-17", "Selamat! Kamu dapat stiker Pakar Matahari. Dan kepingan Baterai untuk rover Mars kita! Sekarang tantangan di rumah: taruh dua es batu. Satu di bawah sinar matahari, satu di tempat teduh. Mana yang cair duluan? Tebak dulu, lalu buktikan!": "e1-18", "Bu, itu apa? Anjing ya?": "e2-01", "Itu kucing, Pipo. Lihat, telinganya runcing dan ada kumisnya.": "e2-02", "Kucing dan anjing bedanya apa, Bu? Aku bingung...": "e2-03", "Pipo belum bisa membedakan, karena Pipo belum pernah belajar. Robot pintar juga harus belajar. Ayo kita ajari Pipo!": "e2-04", "Supaya Pipo bisa membedakan kucing dan anjing, Pipo harus apa? Coba tebak!": "e2-05", "Bu Canni tunjukkan gambar, kamu yang kasih tahu Pipo. Ini kucing atau anjing?": "e2-06", "Yang ini apa?": "e2-07", "Betul! Pipo mencatat: telinga runcing, kumis panjang. Itu kucing.": "e2-08", "Betul! Telinga terkulai, lidah menjulur. Itu anjing.": "e2-09", "Pintar! Pipo makin paham.": "e2-10", "Betul lagi! Pipo mencatat.": "e2-11", "Hebat! Pipo hampir hafal.": "e2-12", "Sempurna! Pipo sudah belajar dari enam contoh!": "e2-13", "Hmm, coba lihat lagi. Telinganya runcing dan ada kumis. Ini kucing. Coba tekan lagi!": "e2-14", "Hmm, coba lihat lagi. Telinganya terkulai dan lidahnya menjulur. Ini anjing. Coba tekan lagi!": "e2-15", "Sekarang giliran Pipo! Ini hewan baru, belum pernah Pipo lihat. Tanya Pipo: ini apa?": "e2-16", "Kucing! Telinganya runcing!": "e2-17", "Satu lagi. Tanya Pipo!": "e2-18", "Anjing! Lidahnya menjulur!": "e2-19", "Yang terakhir. Tanya Pipo!": "e2-20", "Eh? Ini... aku belum pernah belajar ini, Bu! Telinganya panjang sekali...": "e2-21", "Pipo hanya tahu yang sudah diajari. Kelinci belum pernah ada di contoh. Ayo ajari Pipo: ini kelinci!": "e2-22", "Kelinci! Sekarang aku tahu tiga hewan!": "e2-23", "Komputer pintar belajar seperti Pipo: dari banyak contoh. Makin banyak contohnya, makin pintar. Tapi yang belum pernah diajari, dia tidak tahu.": "e2-24", "HP yang bisa mengenali wajah Ayah dan Ibu, belajar dari banyak foto juga, lho! Mata pintar ini kita pasang di rover Mars Pipo.": "e2-25", "Selamat! Kamu dapat stiker Guru Robot. Dan kepingan Mata Pintar untuk rover Mars kita! Sekarang tantangan di rumah: tunjukkan tiga foto hewan ke Ayah atau Ibu, lalu ceritakan apa bedanya. Kamu jadi gurunya!": "e2-26", "Bu Canni! Aku tadi beli es krim, terus tersesat. Aku tidak tahu aku di mana!": "e3-01", "Tenang, Pipo. Jangan ke mana-mana. Ada teman-teman yang bisa melihat Pipo dari langit. Mereka jauh sekali, di atas awan.": "e3-02", "Siapa yang bisa membantu menemukan Pipo dari atas langit? Coba tebak!": "e3-03", "Lihat, ada tiga satelit di langit. Tekan satu satelit untuk minta bantuan!": "e3-04", "Satelit bilang: Pipo ada di dalam lingkaran ini. Hmm, lingkarannya besar sekali! Pipo bisa di mana saja. Tekan satelit lagi!": "e3-05", "Dua lingkaran! Pipo pasti di tempat keduanya bertumpuk. Masih luas. Satu satelit lagi!": "e3-06", "Tiga lingkaran bertemu di satu tempat. Pipo pasti di situ! Tekan tanda tanya di peta!": "e3-07", "Belum, cari tempat ketiga lingkaran bertemu. Di situ ada tanda tanya.": "e3-08", "Ketemu! Bu Canni, aku di dekat toko es krim!": "e3-09", "Satelit mengelilingi Bumi, jauh di atas langit. HP bertanya ke beberapa satelit sekaligus, lalu menggambar titik di peta. Satu satelit saja belum cukup, butuh beberapa.": "e3-10", "Peta di HP Ayah dan Ibu bekerja seperti ini, namanya GPS. Peta ini kita pasang di rover Mars, supaya Pipo tidak tersesat di sana!": "e3-11", "Selamat! Kamu dapat stiker Penjelajah Peta. Dan kepingan Peta untuk rover Mars kita! Sekarang tantangan di rumah: minta Ayah atau Ibu membuka peta di HP. Cari rumahmu, lalu cari sekolahmu. Jauh atau dekat?": "e3-12", "Bu, aku mau kirim surat ke jendela lab Bu Canni pakai layangan. Tapi layanganku tidak mau terbang. Anginnya tidur!": "e4-01", "Layangan memang butuh angin. Tapi Bu Canni punya alat yang bisa terbang tanpa angin: drone! Ayo kita coba.": "e4-02", "Drone bisa terbang tanpa angin. Menurutmu, apa yang membuatnya naik ke atas? Coba tebak!": "e4-03", "Tekan tombolnya cepat-cepat untuk memutar baling-baling! Tap, tap, tap!": "e4-04", "Terbang! Baling-balingnya mendorong udara ke bawah, jadi drone naik. Sekarang geser drone ke jendela Bu Canni.": "e4-05", "Pas di depan jendela! Tekan Antar Surat!": "e4-06", "Terkirim! Terima kasih, Pipo! Suratnya sampai tanpa angin.": "e4-07", "Baling-baling berputar cepat dan mendorong udara ke bawah. Udara yang terdorong membuat drone terangkat ke atas. Layangan beda: dia menunggu angin yang mendorongnya.": "e4-08", "Tahu tidak? Di Mars, ada helikopter kecil bernama Ingenuity yang benar-benar terbang seperti ini! Kita pasang helikopter kecil di rover Pipo.": "e4-09", "Selamat! Kamu dapat stiker Pilot Drone. Dan kepingan Helikopter Mars untuk rover Mars kita! Sekarang tantangan di rumah: tiup telapak tanganmu dari atas, kuat-kuat. Terasa? Itu udara yang terdorong, seperti di bawah drone!": "e4-10", "Semua kepingan sudah lengkap! Baterai, mata pintar, peta, dan helikopter kecil. Ayo ke Mars, Bu!": "e5-01", "Mars sangat jauh, Pipo. Roket butuh berbulan-bulan untuk sampai. Dan kalau rover sudah di Mars, Bu Canni tidak bisa menyetirnya langsung dari Bumi...": "e5-02", "Bagaimana cara menyetir rover yang jauh sekali di Mars? Coba tebak!": "e5-03", "Pertama, roketnya dulu! Hitung mundur bersama Bu Canni. Tekan angkanya!": "e5-04", "Dua.": "e5-05", "Satu.": "e5-06", "Luncurkan! Wuuush!": "e5-07", "Berbulan-bulan kemudian... Rover Pipo mendarat di Mars! Sekarang, susun perintah supaya rover sampai ke bendera. Hati-hati batu!": "e5-08", "Susun dulu perintahnya: panah atas, bawah, kiri, atau kanan.": "e5-09", "Rover menjalankan perintah...": "e5-10", "Aduh! Rover menabrak. Tidak apa-apa, programmer selalu mencoba lagi. Susun ulang ya!": "e5-11", "Rover berhenti, tapi belum sampai bendera. Coba susun lagi!": "e5-12", "Sampai di bendera! Perintahmu tepat. Sekarang level dua, batunya lebih banyak!": "e5-13", "Hebat! Kamu sudah jadi programmer rover Mars!": "e5-14", "Rover di Mars benar-benar dijalankan seperti ini. Ilmuwan di Bumi menyusun perintah satu per satu, lalu mengirimnya. Susunan perintah itu namanya program.": "e5-15", "Orang yang menyusun program namanya programmer. Dan hari ini, kamu sudah jadi programmer! Pipo sampai di Mars berkat kamu.": "e5-16", "Selamat! Kamu dapat stiker Programmer Mars. Dan kepingan Tiket Mars untuk rover Mars kita! Sekarang tantangan di rumah: jadilah rover! Minta Ayah atau Ibu menyusun lima perintah: maju, belok kiri, maju... lalu kamu jalankan persis seperti rover.": "e5-17"};

let muted=false, voice=null, lastText='', currentWho='canni';
/* ---- pilih suara Indonesia terbaik yang ada di perangkat ---- */
const PREF=['damayanti','gadis','google bahasa indonesia','id-id','indonesia'];
function pickVoice(){ if(!('speechSynthesis' in window)) return; const vs=speechSynthesis.getVoices().filter(v=>/^id/i.test(v.lang)); let best=null; for(const p of PREF){ best=vs.find(v=>v.name.toLowerCase().includes(p)); if(best) break; } voice=best||vs[0]||null; }
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
/* ---- emosi per kalimat: nada & tempo menyesuaikan isi kalimat ---- */
function mood(s, who){
  const t=s.toLowerCase();
  const excited=/yeay|hebat|selamat|luar biasa|sempurna|pintar!|betul|terbang!|ketemu|luncurkan|terkirim|wuuush|sampai di bendera|lengkap!|pas di depan/.test(t);
  const worried=/takut|tersesat|bingung|mati lagi|aduh|tidak mau terbang|eh\?|belum pernah belajar ini/.test(t);
  const gentle=/tenang|hmm|tidak apa-apa|belum,|coba lihat lagi/.test(t);
  const ask=/\?$/.test(s.trim());
  if(who==='pipo'){ if(worried) return {rate:1.0,pitch:1.45}; if(excited) return {rate:1.15,pitch:1.8}; return {rate:1.1,pitch:1.65}; }
  if(excited) return {rate:1.0,pitch:1.35};
  if(gentle) return {rate:0.85,pitch:1.05};
  if(ask) return {rate:0.9,pitch:1.25};
  return {rate:0.92,pitch:1.15};
}
function tts(text, who){ if(!('speechSynthesis' in window)) return; try{ speechSynthesis.cancel();
  const parts=text.split(/(?<=[.!?…])\s+/).filter(Boolean);
  parts.forEach(p=>{ const u=new SpeechSynthesisUtterance(p); u.lang='id-ID'; if(voice) u.voice=voice; const m=mood(p,who); u.rate=m.rate; u.pitch=m.pitch; speechSynthesis.speak(u); });
}catch(e){} }
/* ---- efek suara kecil (Web Audio, tanpa file) ---- */
let actx=null; function ac(){ try{ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume(); }catch(e){} return actx; }
function tone(f,t0,d,type='sine',g=0.12){ const c=ac(); if(!c||muted) return; const o=c.createOscillator(), v=c.createGain(); o.type=type; o.frequency.setValueAtTime(f,c.currentTime+t0); v.gain.setValueAtTime(0,c.currentTime+t0); v.gain.linearRampToValueAtTime(g,c.currentTime+t0+0.01); v.gain.exponentialRampToValueAtTime(0.001,c.currentTime+t0+d); o.connect(v).connect(c.destination); o.start(c.currentTime+t0); o.stop(c.currentTime+t0+d+0.05); }
const sfx={
  tap(){ tone(660,0,0.08,'triangle',0.08); },
  pipo(){ tone(880,0,0.07,'square',0.05); tone(1320,0.08,0.09,'square',0.05); },
  win(){ [523,659,784,1047].forEach((f,i)=>tone(f,i*0.09,0.25,'triangle',0.1)); },
  oops(){ tone(330,0,0.15,'sawtooth',0.06); tone(262,0.15,0.25,'sawtooth',0.06); },
  whoosh(){ const c=ac(); if(!c||muted) return; const o=c.createOscillator(), v=c.createGain(); o.type='sawtooth'; o.frequency.setValueAtTime(120,c.currentTime); o.frequency.exponentialRampToValueAtTime(900,c.currentTime+1.2); v.gain.setValueAtTime(0.08,c.currentTime); v.gain.exponentialRampToValueAtTime(0.001,c.currentTime+1.4); o.connect(v).connect(c.destination); o.start(); o.stop(c.currentTime+1.5); }
};
const AUDIO_BASE='audio/'; let player=null, noAudio=false;
function say(text, who){ lastText=text; if(muted) return; try{ speechSynthesis.cancel(); }catch(e){} if(player){ player.pause(); player=null; }
  if(who==='pipo') sfx.pipo();
  const id=LINES[text]; if(!id||noAudio){ tts(text,who); return; }
  const a=new Audio(AUDIO_BASE+id+'.mp3'); player=a;
  a.onerror=()=>{ if(player===a){ noAudio=true; tts(text,who); } };
  a.play().catch(()=>{ if(player===a) tts(text,who); });
}

let e1={round:0,batt:0,meter:0,angle:60,held:0};
const suns=[{x:70,y:70,a:150},{x:200,y:45,a:90},{x:330,y:70,a:30}];
function classroom(lampOn,mood,dark){ return `<rect width="400" height="300" fill="#FFF8E7"/><rect x="0" y="210" width="400" height="90" fill="#E8C9A0"/><rect x="40" y="40" width="200" height="100" rx="8" fill="#2E7D5B" stroke="#8A5A3B" stroke-width="6"/><text x="140" y="98" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="26" fill="#fff">1 + 1 = 2</text><rect x="270" y="150" width="110" height="60" rx="8" fill="#F4A261"/><rect x="278" y="210" width="10" height="40" fill="#C9763C"/><rect x="362" y="210" width="10" height="40" fill="#C9763C"/>${lamp(320,40,lampOn)}${pipo(120,215,mood)}${dark?`<rect width="400" height="300" fill="#1E2A4A" opacity=".72"/>${pipo(120,215,mood)}`:''}`; }
function ep1(){ startEp(1); e1={round:0,batt:0,meter:0,angle:60,held:0};
  scene.innerHTML=classroom(true,'happy',false); speak('Hari ini kita belajar di kelas ya. Pipo juga ikut. Terang sekali kelasnya!');
  next('Lanjut ▶',()=>{ scene.innerHTML=classroom(false,'worried',true); speak('Aaa! Gelap, Bu! Pipo takut gelap!','pipo');
    next('Lanjut ▶',()=>{ speak('Tenang, Pipo. Lampu padam karena listriknya habis. Hmm... Bu Canni punya ide. Ayo ikut ke lab rahasia!'); next('Ke Lab! 🚪',ep1Guess,''); }); });
}
function ep1Guess(){ setStep(1);
  scene.innerHTML=`<rect width="400" height="300" fill="#DDF3FF"/><rect x="0" y="220" width="400" height="80" fill="#B9A7FF"/><rect x="30" y="120" width="340" height="100" rx="14" fill="#fff" stroke="#2B2D42" stroke-width="4"/><rect x="50" y="90" width="60" height="30" rx="6" fill="#FF6F61"/><rect x="130" y="80" width="40" height="40" rx="20" fill="#6FE0B2"/><rect x="190" y="95" width="80" height="25" rx="6" fill="#FFD23F"/>${pipo(200,185,'wow',0.9)}<text x="200" y="50" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="22" fill="#2B2D42">Listrik datang dari mana ya?</text>`;
  guessStep('Lampu butuh listrik. Menurutmu, listrik bisa datang dari mana? Coba tebak!',[
    {k:'matahari',label:'Matahari',svg:`<svg viewBox="0 0 100 100">${sun(50,50,22)}</svg>`},
    {k:'kue',label:'Kue',svg:`<svg viewBox="0 0 100 100"><path d="M20 55h60v25a8 8 0 0 1-8 8H28a8 8 0 0 1-8-8z" fill="#F4A261"/><path d="M18 50q16-14 32 0t32 0v8H18z" fill="#FF8FA3"/><circle cx="50" cy="40" r="7" fill="#FF6F61"/><rect x="48" y="22" width="4" height="16" fill="#2B2D42"/><circle cx="50" cy="18" r="5" fill="#FFD23F"/></svg>`},
    {k:'bulan',label:'Bulan',svg:`<svg viewBox="0 0 100 100"><rect width="100" height="100" rx="20" fill="#1E2A4A"/>${moon(50,50)}</svg>`}
  ],'matahari',()=>{setStep(2);ep1Round();});
}
function labScene(night,sunPos,angle,lampOn,battLevel,battGlow){ return `<rect width="400" height="300" fill="${night?'#1E2A4A':'#CFEBFF'}"/>${night?stars()+moon(80,60):cloud(300,50,0.7)+cloud(90,120,0.5)+sun(sunPos.x,sunPos.y)}<rect x="0" y="230" width="400" height="70" fill="${night?'#2F3C66':'#8BDB8B'}"/><rect x="195" y="170" width="10" height="60" fill="#5B5F7A"/><g transform="translate(200 170) rotate(${90-angle})"><rect x="-55" y="-14" width="110" height="28" rx="6" fill="#2F5DA8" stroke="#2B2D42" stroke-width="4"/><g stroke="#9ED5FF" stroke-width="2">${[-33,-11,11,33].map(x=>`<line x1="${x}" y1="-12" x2="${x}" y2="12"/>`).join('')}<line x1="-52" y1="0" x2="52" y2="0"/></g><circle cx="0" cy="-26" r="6" fill="#FFD23F" stroke="#2B2D42" stroke-width="3"/></g>${lamp(330,180,lampOn)}${battery(70,200,battLevel,battGlow)}${pipo(140,265,lampOn?'yay':'happy',0.55)}<rect x="240" y="250" width="130" height="22" rx="11" fill="#fff" stroke="#2B2D42" stroke-width="3"/><rect x="244" y="254" width="${122*e1.meter}" height="14" rx="7" fill="${e1.meter>0.85?'#3FBF7F':'#FFD23F'}"/><text x="305" y="290" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="12" fill="${night?'#fff':'#2B2D42'}">LISTRIK</text>`; }
function ep1Round(){ const r=e1.round; e1.meter=0; e1.held=0;
  scene.innerHTML=labScene(false,suns[r],e1.angle,false,e1.batt,false);
  speak(['Ini panel surya. Panel ini suka cahaya matahari. Geser tombolnya supaya panel menghadap matahari!','Eh, mataharinya pindah ke atas. Putar panelnya lagi supaya tetap menghadap matahari.','Sekarang matahari sudah di sebelah sana. Kamu pasti bisa!'][r]);
  controls(`<div class="slider-wrap"><label><span>⟵ kiri</span><span>putar panel</span><span>kanan ⟶</span></label><input type="range" id="tilt" min="10" max="170" value="${180-e1.angle}"></div>`);
  const sl=document.getElementById('tilt'); sl.oninput=()=>{ e1.angle=180-parseInt(sl.value,10); };
  stopLoop(); loop=setInterval(()=>{ const diff=Math.abs(e1.angle-suns[r].a); const target=Math.max(0,1-diff/60); e1.meter+=(target-e1.meter)*0.25; const on=e1.meter>0.85; scene.innerHTML=labScene(false,suns[r],e1.angle,on,e1.batt,false);
    if(on){ e1.held++; if(e1.held===1) speak(['Yeay! Lampunya nyala! Lihat, Pipo senang sekali.','Hebat! Nyala lagi! Listriknya kita simpan juga ke baterai ya.','Luar biasa! Baterainya hampir penuh!'][r]); if(e1.held>14){ stopLoop(); e1.batt=Math.min(1,e1.batt+0.34); confetti(); scene.innerHTML=labScene(false,suns[r],e1.angle,true,e1.batt,false); next(r<2?'Lanjut ▶':'Sudah malam 🌙',()=>{ e1.round++; e1.round<3?ep1Round():ep1Night(); },'mint'); } } else e1.held=0; },100);
}
function ep1Night(){ e1.meter=0; scene.innerHTML=labScene(true,null,e1.angle,false,e1.batt,false); speak('Bu, sudah malam! Mataharinya tidur. Lampunya mati lagi...','pipo');
  next('Lanjut ▶',()=>{ speak('Kalau malam, bagaimana ya? Ingat tidak, tadi siang listriknya kita simpan di baterai. Coba tekan baterainya!'); scene.innerHTML=labScene(true,null,e1.angle,false,e1.batt,true); controls(''); const b=document.getElementById('batt'); b.style.cursor='pointer'; b.onclick=()=>{ e1.meter=1; scene.innerHTML=labScene(true,null,e1.angle,true,e1.batt,false); confetti(); speak('Yeay! Nyala! Baterainya menyimpan listrik dari matahari untuk malam hari.'); next('Wah, kok bisa? 🤔',ep1Aha,'mint'); }; });
}
function ep1Aha(){ setStep(3);
  scene.innerHTML=`<rect width="400" height="300" fill="#FFF8E7"/>${sun(60,70,24)}<path d="M95 70h40" stroke="#FFB703" stroke-width="5" stroke-linecap="round" stroke-dasharray="8 8"/><g transform="translate(180 70)"><rect x="-40" y="-20" width="80" height="40" rx="8" fill="#2F5DA8" stroke="#2B2D42" stroke-width="4"/><g stroke="#9ED5FF" stroke-width="2"><line x1="-20" y1="-18" x2="-20" y2="18"/><line x1="0" y1="-18" x2="0" y2="18"/><line x1="20" y1="-18" x2="20" y2="18"/></g></g><path d="M225 70h40" stroke="#3FBF7F" stroke-width="5" stroke-linecap="round" stroke-dasharray="8 8"/>${battery(300,70,1,false)}<path d="M300 115v40" stroke="#3FBF7F" stroke-width="5" stroke-linecap="round" stroke-dasharray="8 8"/>${lamp(300,190,true)}<text x="60" y="120" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="14">cahaya</text><text x="180" y="120" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="14">panel surya</text><text x="300" y="250" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="14">lampu</text>${pipo(110,235,'wow',0.8)}`;
  speak('Panel surya mengubah cahaya matahari menjadi listrik. Baterai menyimpannya, supaya malam hari lampu tetap bisa nyala.');
  next('Lanjut ▶',()=>{ speak('Lampu jalan di dekat rumahmu, banyak yang pakai panel surya, lho! Coba cari kalau kamu lewat ya. Dan baterai ini, kita simpan untuk rover Mars Pipo.'); next('Buku Penasaran 📒',()=>finishEpisode(1,{icon:'☀️',name:'Pakar Matahari'},{icon:'🧊',say:'taruh dua es batu. Satu di bawah sinar matahari, satu di tempat teduh. Mana yang cair duluan? Tebak dulu, lalu buktikan!',text:'Dua es batu: satu di matahari, satu di tempat teduh. Mana yang cair duluan?'}),'mint'); });
}

/* ================= EPISODE 2: Pipo Belajar Mengenal Kucing ================= */
const garden=(extra='')=>`<rect width="400" height="300" fill="#CFEBFF"/>${sun(340,50,22)}${cloud(80,50,0.7)}<rect x="0" y="200" width="400" height="100" fill="#8BDB8B"/><ellipse cx="60" cy="200" rx="50" ry="22" fill="#5FBF7F"/><ellipse cx="330" cy="205" rx="60" ry="24" fill="#5FBF7F"/><rect x="40" y="110" width="60" height="90" fill="#8A5A3B" rx="6"/><circle cx="70" cy="100" r="50" fill="#3FBF7F"/>${extra}`;
let e2={i:0,learned:0};
const trainSet=[{k:'kucing',c:'#F4A261'},{k:'anjing',c:'#C58B5A'},{k:'kucing',c:'#9A9AB5'},{k:'anjing',c:'#2B2D42'},{k:'kucing',c:'#fff'},{k:'anjing',c:'#F4E1C1'}];
function animal(k,x,y,s,c){ return k==='kucing'?cat(x,y,s,c):k==='anjing'?dog(x,y,s,c):rabbit(x,y,s); }
function brainMeter(v){ return `<rect x="150" y="262" width="100" height="18" rx="9" fill="#fff" stroke="#2B2D42" stroke-width="3"/><rect x="153" y="265" width="${94*v}" height="12" rx="6" fill="#B9A7FF"/><text x="200" y="256" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="12" fill="#2B2D42">PIPO BELAJAR</text>`; }
function ep2(){ startEp(2); e2={i:0,learned:0};
  scene.innerHTML=garden(cat(300,180,0.9)+pipo(180,215,'wow')); speak('Bu, itu apa? Anjing ya?','pipo');
  next('Lanjut ▶',()=>{ speak('Itu kucing, Pipo. Lihat, telinganya runcing dan ada kumisnya.'); next('Lanjut ▶',()=>{ speak('Kucing dan anjing bedanya apa, Bu? Aku bingung...','pipo'); next('Lanjut ▶',()=>{ speak('Pipo belum bisa membedakan, karena Pipo belum pernah belajar. Robot pintar juga harus belajar. Ayo kita ajari Pipo!'); next('Ke Lab! 🚪',ep2Guess,''); }); }); });
}
function ep2Guess(){ setStep(1); scene.innerHTML=garden(pipo(200,215,'think')+`<text x="200" y="60" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="22" fill="#2B2D42">Bagaimana Pipo bisa belajar?</text>`);
  guessStep('Supaya Pipo bisa membedakan kucing dan anjing, Pipo harus apa? Coba tebak!',[
    {k:'contoh',label:'Lihat contoh',svg:`<svg viewBox="0 0 100 100">${cat(32,50,0.5)}${dog(70,50,0.5)}</svg>`},
    {k:'tidur',label:'Tidur',svg:`<svg viewBox="0 0 100 100"><rect width="100" height="100" rx="20" fill="#1E2A4A"/>${moon(50,50)}</svg>`},
    {k:'ikan',label:'Makan ikan',svg:`<svg viewBox="0 0 100 100"><path d="M20 50q25-25 50 0q-25 25-50 0z" fill="#9ED5FF" stroke="#2B2D42" stroke-width="3"/><path d="M70 50l16-12v24z" fill="#9ED5FF" stroke="#2B2D42" stroke-width="3"/><circle cx="34" cy="46" r="3" fill="#2B2D42"/></svg>`}
  ],'contoh',()=>{setStep(2);ep2Train();});
}
function ep2Train(){ const t=trainSet[e2.i];
  scene.innerHTML=garden(animal(t.k,290,150,1,t.c)+pipo(120,215,'think')+brainMeter(e2.learned/6)+`<path d="M160 140q40 -30 80 -10" fill="none" stroke="#2B2D42" stroke-width="3" stroke-dasharray="5 5"/><text x="200" y="40" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="20" fill="#2B2D42">Ini apa? ${e2.i+1}/6</text>`);
  if(e2.i===0) speak('Bu Canni tunjukkan gambar, kamu yang kasih tahu Pipo. Ini kucing atau anjing?'); else speak('Yang ini apa?');
  controls(`<div class="pair">${btn('🐱 Kucing',()=>ep2Answer('kucing'),'')}${btn('🐶 Anjing',()=>ep2Answer('anjing'),'mint')}</div>`);
}
function ep2Answer(k){ const t=trainSet[e2.i]; if(k===t.k){ e2.learned++; speak(['Betul! Pipo mencatat: telinga runcing, kumis panjang. Itu kucing.','Betul! Telinga terkulai, lidah menjulur. Itu anjing.','Pintar! Pipo makin paham.','Betul lagi! Pipo mencatat.','Hebat! Pipo hampir hafal.','Sempurna! Pipo sudah belajar dari enam contoh!'][e2.i]); e2.i++; scene.innerHTML=garden(animal(t.k,290,150,1,t.c)+pipo(120,215,'yay')+brainMeter(e2.learned/6)); next(e2.i<6?'Gambar berikutnya ▶':'Tes Pipo! 🧠',e2.i<6?ep2Train:ep2Test,'mint'); }
  else { speak(t.k==='kucing'?'Hmm, coba lihat lagi. Telinganya runcing dan ada kumis. Ini kucing. Coba tekan lagi!':'Hmm, coba lihat lagi. Telinganya terkulai dan lidahnya menjulur. Ini anjing. Coba tekan lagi!'); }
}
let e2test=0;
function ep2Test(){ const tests=[{k:'kucing',c:'#C58B5A',s:'Kucing!',say:'Kucing! Telinganya runcing!'},{k:'anjing',c:'#9A9AB5',s:'Anjing!',say:'Anjing! Lidahnya menjulur!'},{k:'kelinci',s:'???',say:'Eh? Ini... aku belum pernah belajar ini, Bu! Telinganya panjang sekali...'}]; const t=tests[e2test];
  const draw=(ans)=>scene.innerHTML=garden(animal(t.k,290,150,1,t.c)+pipo(120,215,ans?(t.k==='kelinci'?'worried':'yay'):'think')+(ans?`<g transform="translate(120 120)"><ellipse rx="52" ry="26" fill="#fff" stroke="#2B2D42" stroke-width="3"/><circle cx="20" cy="30" r="5" fill="#fff" stroke="#2B2D42" stroke-width="2"/><text y="8" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="22" fill="#2B2D42">${t.s}</text></g>`:'')+`<text x="200" y="40" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="20" fill="#2B2D42">Tes Pipo ${e2test+1}/3</text>`);
  draw(false);
  speak(e2test===0?'Sekarang giliran Pipo! Ini hewan baru, belum pernah Pipo lihat. Tanya Pipo: ini apa?':e2test===1?'Satu lagi. Tanya Pipo!':'Yang terakhir. Tanya Pipo!');
  next('🎤 Pipo, ini apa?',()=>{ draw(true); speak(t.say,'pipo');
    if(e2test<2) next('Benar, Pipo! 👏',()=>{e2test++;ep2Test();},'mint');
    else next('Kenapa Pipo bingung? 🤔',()=>{ speak('Pipo hanya tahu yang sudah diajari. Kelinci belum pernah ada di contoh. Ayo ajari Pipo: ini kelinci!'); controls(btn('Ajari: 🐰 Kelinci',()=>{ scene.innerHTML=garden(rabbit(290,150,1)+pipo(120,215,'yay')+`<g transform="translate(120 120)"><ellipse rx="52" ry="26" fill="#fff" stroke="#2B2D42" stroke-width="3"/><text y="8" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="22" fill="#2B2D42">Kelinci!</text></g>`); confetti(); speak('Kelinci! Sekarang aku tahu tiga hewan!','pipo'); next('Wah, kok bisa? 🤔',ep2Aha,'mint'); },'')); },'');
  },'mint');
}
function ep2Aha(){ setStep(3); e2test=0;
  scene.innerHTML=`<rect width="400" height="300" fill="#FFF8E7"/>${cat(60,70,0.6)}${dog(60,150,0.6)}${rabbit(60,235,0.55)}<path d="M100 150h50" stroke="#B9A7FF" stroke-width="5" stroke-linecap="round" stroke-dasharray="8 8"/>${pipo(200,150,'happy')}<path d="M250 150h50" stroke="#3FBF7F" stroke-width="5" stroke-linecap="round" stroke-dasharray="8 8"/><rect x="305" y="110" width="70" height="80" rx="10" fill="#fff" stroke="#2B2D42" stroke-width="3"/><text x="340" y="145" text-anchor="middle" font-size="26">📷</text><text x="340" y="175" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="12">MATA PINTAR</text><text x="60" y="290" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="14">banyak contoh</text>`;
  speak('Komputer pintar belajar seperti Pipo: dari banyak contoh. Makin banyak contohnya, makin pintar. Tapi yang belum pernah diajari, dia tidak tahu.');
  next('Lanjut ▶',()=>{ speak('HP yang bisa mengenali wajah Ayah dan Ibu, belajar dari banyak foto juga, lho! Mata pintar ini kita pasang di rover Mars Pipo.'); next('Buku Penasaran 📒',()=>finishEpisode(2,{icon:'🤖',name:'Guru Robot'},{icon:'📸',say:'tunjukkan tiga foto hewan ke Ayah atau Ibu, lalu ceritakan apa bedanya. Kamu jadi gurunya!',text:'Tunjukkan 3 foto hewan ke Ayah/Ibu, ceritakan bedanya. Kamu gurunya!'}),'mint'); });
}

/* ================= EPISODE 3: Pipo Tersesat ================= */
let e3={sats:[],found:false};
const PIPO_POS={x:250,y:195};
const SATS=[{x:70,y:35,r:241},{x:200,y:30,r:172},{x:340,y:40,r:179}];
function cityMap(){ return `<rect width="400" height="300" fill="#DFF5E1"/><g stroke="#fff" stroke-width="18">${[100,220,340].map(x=>`<line x1="${x}" y1="60" x2="${x}" y2="300"/>`).join('')}<line x1="0" y1="130" x2="400" y2="130"/><line x1="0" y1="240" x2="400" y2="240"/></g><g fill="#F4A261">${[[20,70],[140,150],[260,70],[360,160],[30,260],[150,255]].map(p=>`<rect x="${p[0]}" y="${p[1]}" width="40" height="36" rx="6"/>`).join('')}</g><g fill="#FF8FA3"><rect x="130" y="70" width="40" height="36" rx="6"/><rect x="250" y="250" width="40" height="36" rx="6"/></g><g fill="#3FBF7F"><circle cx="330" cy="100" r="16"/><circle cx="60" cy="180" r="16"/></g>`; }
function ep3(){ startEp(3); e3={sats:[],found:false};
  scene.innerHTML=cityMap()+pipo(250,195,'worried',0.8)+`<rect width="400" height="300" fill="#1E2A4A" opacity=".55"/><text x="200" y="40" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="22" fill="#fff">Pipo di mana ya?</text>${pipo(250,195,'worried',0.8)}`;
  speak('Bu Canni! Aku tadi beli es krim, terus tersesat. Aku tidak tahu aku di mana!','pipo');
  next('Lanjut ▶',()=>{ speak('Tenang, Pipo. Jangan ke mana-mana. Ada teman-teman yang bisa melihat Pipo dari langit. Mereka jauh sekali, di atas awan.'); next('Siapa ya? 🤔',ep3Guess,''); });
}
function ep3Guess(){ setStep(1); scene.innerHTML=`<rect width="400" height="300" fill="#1E2A4A"/>${stars()}<circle cx="200" cy="330" r="150" fill="#3FBF7F"/><circle cx="200" cy="330" r="150" fill="none" stroke="#9ED5FF" stroke-width="8"/>${pipo(200,190,'worried',0.7)}<text x="200" y="60" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="22" fill="#fff">Siapa yang melihat dari langit?</text>`;
  guessStep('Siapa yang bisa membantu menemukan Pipo dari atas langit? Coba tebak!',[
    {k:'satelit',label:'Satelit',svg:`<svg viewBox="0 0 100 100"><rect width="100" height="100" rx="20" fill="#1E2A4A"/>${satellite(50,55,false)}</svg>`},
    {k:'burung',label:'Burung',svg:`<svg viewBox="0 0 100 100"><ellipse cx="50" cy="55" rx="22" ry="16" fill="#FF6F61" stroke="#2B2D42" stroke-width="3"/><circle cx="66" cy="42" r="11" fill="#FF6F61" stroke="#2B2D42" stroke-width="3"/><path d="M76 42l10 3-10 3z" fill="#FFD23F"/><circle cx="69" cy="40" r="2" fill="#2B2D42"/><path d="M40 50q-10-14 4-16" fill="none" stroke="#2B2D42" stroke-width="3"/></svg>`},
    {k:'awan',label:'Awan',svg:`<svg viewBox="0 0 100 100"><rect width="100" height="100" rx="20" fill="#9ED5FF"/>${cloud(50,55,0.9)}</svg>`}
  ],'satelit',()=>{setStep(2);ep3Play();});
}
function ep3Draw(){ const n=e3.sats.length; return cityMap()+`<rect x="0" y="0" width="400" height="60" fill="#1E2A4A"/>${stars()}`+SATS.map((s,i)=>satellite(s.x,s.y,!e3.sats.includes(i))).join('')+e3.sats.map(i=>{const s=SATS[i]; return `<circle cx="${s.x}" cy="${s.y}" r="${s.r}" fill="#FF6F61" opacity=".15" stroke="#FF6F61" stroke-width="3" stroke-dasharray="8 6"/><line x1="${s.x}" y1="${s.y}" x2="${PIPO_POS.x}" y2="${PIPO_POS.y}" stroke="#FFD23F" stroke-width="2" stroke-dasharray="4 6" opacity=".7"/>`;}).join('')+(e3.found?pipo(PIPO_POS.x,PIPO_POS.y,'yay',0.8):`<g transform="translate(${PIPO_POS.x} ${PIPO_POS.y})" opacity="${n>=3?0.5:0}"><circle r="22" fill="#fff" stroke="#2B2D42" stroke-width="3"/><text y="9" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="24">?</text></g>`); }
function ep3Play(){ scene.innerHTML=ep3Draw(); speak('Lihat, ada tiga satelit di langit. Tekan satu satelit untuk minta bantuan!'); controls(''); ep3Bind(); }
function ep3Bind(){ scene.querySelectorAll('.sat').forEach((el,i)=>el.onclick=()=>{ if(e3.sats.includes(i)||e3.sats.length>=3) return; e3.sats.push(i); scene.innerHTML=ep3Draw(); ep3Bind(); const n=e3.sats.length;
  if(n===1) speak('Satelit bilang: Pipo ada di dalam lingkaran ini. Hmm, lingkarannya besar sekali! Pipo bisa di mana saja. Tekan satelit lagi!');
  if(n===2) speak('Dua lingkaran! Pipo pasti di tempat keduanya bertumpuk. Masih luas. Satu satelit lagi!');
  if(n===3){ speak('Tiga lingkaran bertemu di satu tempat. Pipo pasti di situ! Tekan tanda tanya di peta!'); const q=scene.querySelector('g[opacity="0.5"]'); scene.onclick=(ev)=>{ const pt=scene.createSVGPoint(); pt.x=ev.clientX; pt.y=ev.clientY; const p=pt.matrixTransform(scene.getScreenCTM().inverse()); if(Math.hypot(p.x-PIPO_POS.x,p.y-PIPO_POS.y)<45){ scene.onclick=null; e3.found=true; scene.innerHTML=ep3Draw(); confetti(); speak('Ketemu! Bu Canni, aku di dekat toko es krim!','pipo'); next('Wah, kok bisa? 🤔',ep3Aha,'mint'); } else speak('Belum, cari tempat ketiga lingkaran bertemu. Di situ ada tanda tanya.'); }; }
}); }
function ep3Aha(){ setStep(3); scene.onclick=null;
  scene.innerHTML=`<rect width="400" height="300" fill="#1E2A4A"/>${stars()}${satellite(80,50,false)}${satellite(200,35,false)}${satellite(320,50,false)}<circle cx="200" cy="330" r="150" fill="#3FBF7F"/><circle cx="200" cy="330" r="150" fill="none" stroke="#9ED5FF" stroke-width="8"/><g stroke="#FFD23F" stroke-width="2" stroke-dasharray="4 6"><line x1="80" y1="60" x2="200" y2="200"/><line x1="200" y1="45" x2="200" y2="200"/><line x1="320" y1="60" x2="200" y2="200"/></g><rect x="170" y="195" width="60" height="90" rx="10" fill="#fff" stroke="#2B2D42" stroke-width="3"/><text x="200" y="250" text-anchor="middle" font-size="30">🗺️</text><text x="200" y="110" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="14" fill="#fff">satelit → HP → peta</text>`;
  speak('Satelit mengelilingi Bumi, jauh di atas langit. HP bertanya ke beberapa satelit sekaligus, lalu menggambar titik di peta. Satu satelit saja belum cukup, butuh beberapa.');
  next('Lanjut ▶',()=>{ speak('Peta di HP Ayah dan Ibu bekerja seperti ini, namanya GPS. Peta ini kita pasang di rover Mars, supaya Pipo tidak tersesat di sana!'); next('Buku Penasaran 📒',()=>finishEpisode(3,{icon:'🛰️',name:'Penjelajah Peta'},{icon:'📍',say:'minta Ayah atau Ibu membuka peta di HP. Cari rumahmu, lalu cari sekolahmu. Jauh atau dekat?',text:'Buka peta di HP bersama Ayah/Ibu: cari rumahmu, lalu sekolahmu.'}),'mint'); });
}

/* ================= EPISODE 4: Layangan vs Drone ================= */
let e4={lift:0,y:0,x:0,phase:1};
function labOutside(dy,dx,spin,extra=''){ const gy=250; return `<rect width="400" height="300" fill="#CFEBFF"/>${sun(60,50,22)}${cloud(300,40,0.7)}<rect x="0" y="${gy}" width="400" height="50" fill="#8BDB8B"/><rect x="250" y="70" width="130" height="180" fill="#FFB4A8" stroke="#2B2D42" stroke-width="4"/><rect x="290" y="100" width="50" height="44" rx="6" fill="#9ED5FF" stroke="#2B2D42" stroke-width="3"/><rect x="300" y="200" width="30" height="50" fill="#8A5A3B" stroke="#2B2D42" stroke-width="3"/><g transform="translate(315 128)"><circle r="12" fill="#FFE3C4"/><path d="M-13 -2c0-14 8-20 13-20s13 6 13 20c-4-6-22-6-26 0z" fill="#4A2E1F"/><circle cx="-4" cy="2" r="4" fill="none" stroke="#2B2D42" stroke-width="1.5"/><circle cx="4" cy="2" r="4" fill="none" stroke="#2B2D42" stroke-width="1.5"/></g><rect x="40" y="258" width="90" height="16" rx="8" fill="#fff" stroke="#2B2D42" stroke-width="3"/><rect x="43" y="261" width="${84*e4.lift}" height="10" rx="5" fill="#B9A7FF"/><text x="85" y="290" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="12">ANGKAT</text>${drone(60+dx,gy-20-dy,spin)}${extra}`; }
function ep4(){ startEp(4); e4={lift:0,y:0,x:0,phase:1};
  scene.innerHTML=`<rect width="400" height="300" fill="#CFEBFF"/>${sun(340,50,22)}<rect x="0" y="250" width="400" height="50" fill="#8BDB8B"/>${pipo(120,215,'worried')}<g transform="translate(210 230)"><path d="M0 -30l22 30-22 30-22-30z" fill="#FF6F61" stroke="#2B2D42" stroke-width="3"/><line x1="0" y1="-30" x2="0" y2="30" stroke="#2B2D42" stroke-width="2"/><line x1="-22" y1="0" x2="22" y2="0" stroke="#2B2D42" stroke-width="2"/><path d="M0 30q10 10 0 20t0 20" fill="none" stroke="#2B2D42" stroke-width="2"/></g><text x="200" y="60" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="20" fill="#2B2D42">Anginnya tidur...</text>`;
  speak('Bu, aku mau kirim surat ke jendela lab Bu Canni pakai layangan. Tapi layanganku tidak mau terbang. Anginnya tidur!','pipo');
  next('Lanjut ▶',()=>{ speak('Layangan memang butuh angin. Tapi Bu Canni punya alat yang bisa terbang tanpa angin: drone! Ayo kita coba.'); next('Ke Lab! 🚪',ep4Guess,''); });
}
function ep4Guess(){ setStep(1); scene.innerHTML=`<rect width="400" height="300" fill="#DDF3FF"/><rect x="0" y="220" width="400" height="80" fill="#B9A7FF"/>${drone(200,150,false)}${pipo(80,215,'wow',0.8)}<text x="200" y="50" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="22" fill="#2B2D42">Apa yang membuat drone naik?</text>`;
  guessStep('Drone bisa terbang tanpa angin. Menurutmu, apa yang membuatnya naik ke atas? Coba tebak!',[
    {k:'baling',label:'Baling-baling',svg:`<svg viewBox="0 0 100 100"><ellipse cx="50" cy="50" rx="40" ry="8" fill="#2B2D42"/><ellipse cx="50" cy="50" rx="8" ry="40" fill="#2B2D42"/><circle cx="50" cy="50" r="9" fill="#FFD23F" stroke="#2B2D42" stroke-width="3"/></svg>`},
    {k:'sayap',label:'Sayap',svg:`<svg viewBox="0 0 100 100"><path d="M10 60q40-40 80 0q-40 10-80 0z" fill="#fff" stroke="#2B2D42" stroke-width="3"/></svg>`},
    {k:'balon',label:'Balon',svg:`<svg viewBox="0 0 100 100"><ellipse cx="50" cy="42" rx="26" ry="32" fill="#FF6F61" stroke="#2B2D42" stroke-width="3"/><path d="M50 74l-5 8h10z" fill="#FF6F61" stroke="#2B2D42" stroke-width="2"/><path d="M50 82q-6 8 0 16" fill="none" stroke="#2B2D42" stroke-width="2"/></svg>`}
  ],'baling',()=>{setStep(2);ep4Lift();});
}
function ep4Lift(){ e4.phase=1; scene.innerHTML=labOutside(0,0,false); speak('Tekan tombolnya cepat-cepat untuk memutar baling-baling! Tap, tap, tap!');
  controls(btn('🌀 PUTAR!',()=>{ e4.lift=Math.min(1,e4.lift+0.09); },'big'));
  stopLoop(); loop=setInterval(()=>{ if(e4.phase!==1) return; e4.lift=Math.max(0,e4.lift-0.008); e4.y+= (e4.lift*120-e4.y)*0.15; scene.innerHTML=labOutside(e4.y,0,e4.lift>0.2); if(e4.y>105){ e4.phase=2; stopLoop(); speak('Terbang! Baling-balingnya mendorong udara ke bawah, jadi drone naik. Sekarang geser drone ke jendela Bu Canni.'); ep4Steer(); } },80); }
function ep4Steer(){ controls(`<div class="slider-wrap"><label><span>⟵ kiri</span><span>geser drone</span><span>kanan ⟶</span></label><input type="range" id="dx" min="0" max="280" value="0"></div>`); const sl=document.getElementById('dx'); sl.oninput=()=>{ e4.x=parseInt(sl.value,10); scene.innerHTML=labOutside(e4.y,e4.x,true); if(Math.abs(e4.x-255)<20 && !e4.sent){ e4.sent=true; speak('Pas di depan jendela! Tekan Antar Surat!'); controls(btn('💌 Antar surat!',()=>{ scene.innerHTML=labOutside(e4.y,e4.x,true,`<text x="315" y="150" text-anchor="middle" font-size="26">💌</text>`); confetti(); speak('Terkirim! Terima kasih, Pipo! Suratnya sampai tanpa angin.'); next('Wah, kok bisa? 🤔',ep4Aha,'mint'); },'mint')); } }; }
function ep4Aha(){ setStep(3); scene.innerHTML=`<rect width="400" height="300" fill="#FFF8E7"/>${drone(130,110,true)}<g stroke="#9ED5FF" stroke-width="5" stroke-linecap="round"><path d="M86 130v40M174 130v40"/><path d="M78 160l8 12 8-12M166 160l8 12 8-12"/></g><text x="130" y="200" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="14">udara didorong ke bawah</text><path d="M130 80v-30" stroke="#3FBF7F" stroke-width="6" stroke-linecap="round"/><path d="M120 60l10-14 10 14" fill="none" stroke="#3FBF7F" stroke-width="6" stroke-linecap="round"/><text x="130" y="36" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="14" fill="#2D8F5E">drone naik</text><rect x="250" y="40" width="130" height="200" rx="14" fill="#F4A261"/><text x="315" y="130" text-anchor="middle" font-size="40">🚁</text><text x="315" y="170" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="13">Helikopter Mars</text><text x="315" y="190" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="13">"Ingenuity"</text>`;
  speak('Baling-baling berputar cepat dan mendorong udara ke bawah. Udara yang terdorong membuat drone terangkat ke atas. Layangan beda: dia menunggu angin yang mendorongnya.');
  next('Lanjut ▶',()=>{ speak('Tahu tidak? Di Mars, ada helikopter kecil bernama Ingenuity yang benar-benar terbang seperti ini! Kita pasang helikopter kecil di rover Pipo.'); next('Buku Penasaran 📒',()=>finishEpisode(4,{icon:'🚁',name:'Pilot Drone'},{icon:'🖐️',say:'tiup telapak tanganmu dari atas, kuat-kuat. Terasa? Itu udara yang terdorong, seperti di bawah drone!',text:'Tiup telapak tanganmu dari atas, kuat-kuat. Terasa? Itu udara yang terdorong.'}),'mint'); });
}

/* ================= EPISODE 5: Pipo ke Mars! ================= */
let e5={prog:[],level:0,pos:{x:0,y:1}};
const LEVELS=[{rocks:[[2,1],[1,0]],flag:[4,1]},{rocks:[[1,1],[3,0],[2,3],[3,3]],flag:[4,3]}];
function ep5(){ startEp(5); e5={prog:[],level:0,pos:{x:0,y:1}};
  scene.innerHTML=`<rect width="400" height="300" fill="#1E2A4A"/>${stars()}<circle cx="330" cy="70" r="30" fill="#E07A5F"/><rect x="0" y="250" width="400" height="50" fill="#8BDB8B"/>${rocket(200,170,false)}${pipo(90,215,'yay',0.9)}${rover(300,235,0.7)}`;
  speak('Semua kepingan sudah lengkap! Baterai, mata pintar, peta, dan helikopter kecil. Ayo ke Mars, Bu!','pipo');
  next('Lanjut ▶',()=>{ speak('Mars sangat jauh, Pipo. Roket butuh berbulan-bulan untuk sampai. Dan kalau rover sudah di Mars, Bu Canni tidak bisa menyetirnya langsung dari Bumi...'); next('Lalu bagaimana? 🤔',ep5Guess,''); });
}
function ep5Guess(){ setStep(1); scene.innerHTML=`<rect width="400" height="300" fill="#1E2A4A"/>${stars()}<circle cx="60" cy="240" r="60" fill="#3FBF7F"/><circle cx="340" cy="90" r="45" fill="#E07A5F"/>${rover(340,80,0.5)}<path d="M110 210q110-120 185 -90" fill="none" stroke="#FFD23F" stroke-width="3" stroke-dasharray="6 8"/><text x="200" y="60" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="20" fill="#fff">Jauh sekali...</text>`;
  guessStep('Bagaimana cara menyetir rover yang jauh sekali di Mars? Coba tebak!',[
    {k:'perintah',label:'Kirim perintah',svg:`<svg viewBox="0 0 100 100"><rect x="15" y="30" width="70" height="40" rx="8" fill="#fff" stroke="#2B2D42" stroke-width="3"/><text x="50" y="58" text-anchor="middle" font-size="22">➡️⬆️</text></svg>`},
    {k:'teriak',label:'Teriak keras',svg:`<svg viewBox="0 0 100 100"><text x="50" y="66" text-anchor="middle" font-size="44">📣</text></svg>`},
    {k:'lari',label:'Lari ke sana',svg:`<svg viewBox="0 0 100 100"><text x="50" y="66" text-anchor="middle" font-size="44">🏃</text></svg>`}
  ],'perintah',()=>{setStep(2);ep5Launch();});
}
function ep5Launch(){ let c=3, y=0; scene.innerHTML=`<rect width="400" height="300" fill="#1E2A4A"/>${stars()}<rect x="0" y="250" width="400" height="50" fill="#8BDB8B"/>${rocket(200,170,false)}<text x="200" y="80" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="48" fill="#FFD23F">3</text>`;
  speak('Pertama, roketnya dulu! Hitung mundur bersama Bu Canni. Tekan angkanya!');
  const step=()=>{ if(c>1){ c--; scene.innerHTML=`<rect width="400" height="300" fill="#1E2A4A"/>${stars()}<rect x="0" y="250" width="400" height="50" fill="#8BDB8B"/>${rocket(200,170,c===1)}<text x="200" y="80" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="48" fill="#FFD23F">${c}</text>`; speak(['','Satu','Dua'][c]+'.'); controls(btn(c===1?'🚀 LUNCURKAN!':String(c-1),step,'big mint')); }
    else { speak('Luncurkan! Wuuush!'); sfx.whoosh(); controls(''); stopLoop(); loop=setInterval(()=>{ y+=8; scene.innerHTML=`<rect width="400" height="300" fill="#1E2A4A"/>${stars()}<rect x="0" y="${250+y}" width="400" height="50" fill="#8BDB8B"/>${rocket(200,170-y,true)}`; if(y>260){ stopLoop(); ep5Land(); } },50); } };
  controls(btn('3',step,'big mint'));
}
function ep5Land(){ scene.innerHTML=marsScene(); speak('Berbulan-bulan kemudian... Rover Pipo mendarat di Mars! Sekarang, susun perintah supaya rover sampai ke bendera. Hati-hati batu!'); e5.pos={x:0,y:1}; e5.prog=[]; ep5Program(); }
function marsScene(runIdx=-1){ const L=LEVELS[e5.level], cs=64, ox=40, oy=30; let g=`<rect width="400" height="300" fill="#E07A5F"/>`; for(let r=0;r<4;r++)for(let c=0;c<5;c++) g+=`<rect x="${ox+c*cs}" y="${oy+r*cs}" width="${cs-4}" height="${cs-4}" rx="8" fill="#F2A07B" opacity=".6"/>`; L.rocks.forEach(p=>g+=`<g transform="translate(${ox+p[0]*cs+30} ${oy+p[1]*cs+32})"><ellipse rx="22" ry="16" fill="#8A5A3B" stroke="#2B2D42" stroke-width="3"/><ellipse cx="-6" cy="-6" rx="7" ry="4" fill="#B07A52"/></g>`); g+=`<g transform="translate(${ox+L.flag[0]*cs+30} ${oy+L.flag[1]*cs+30})"><line x1="-6" y1="-24" x2="-6" y2="24" stroke="#2B2D42" stroke-width="4"/><path d="M-6 -24h30l-8 10 8 10h-30z" fill="#3FBF7F" stroke="#2B2D42" stroke-width="3"/></g>`; g+=rover(ox+e5.pos.x*cs+30,oy+e5.pos.y*cs+36,0.55); g+=`<text x="200" y="292" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="13" fill="#fff">MARS · Level ${e5.level+1}</text>`; return g; }
const ARROWS={u:'⬆️',d:'⬇️',l:'⬅️',r:'➡️'};
function ep5Program(){ scene.innerHTML=marsScene();
  controls(`<div class="program" id="prog">${e5.prog.map(a=>`<i>${ARROWS[a]}</i>`).join('')||'<span style="color:#999;font-weight:600;padding:6px">Susun perintah di sini…</span>'}</div>`+['u','l','d','r'].map(a=>btn(ARROWS[a],()=>{ if(e5.prog.length<8){ e5.prog.push(a); ep5Program(); } },'sq ghost')).join('')+btn('🗑️',()=>{ e5.prog=[]; ep5Program(); },'sq ghost')+btn('▶ Jalan!',ep5Run,'mint'));
}
function ep5Run(){ if(!e5.prog.length){ speak('Susun dulu perintahnya: panah atas, bawah, kiri, atau kanan.'); return; } controls(`<div class="program" id="prog">${e5.prog.map((a,i)=>`<i id="p${i}">${ARROWS[a]}</i>`).join('')}</div>`); const L=LEVELS[e5.level]; let i=0; speak('Rover menjalankan perintah...');
  stopLoop(); loop=setInterval(()=>{ if(i>=e5.prog.length){ stopLoop(); if(e5.pos.x===L.flag[0]&&e5.pos.y===L.flag[1]){ confetti(); speak(e5.level===0?'Sampai di bendera! Perintahmu tepat. Sekarang level dua, batunya lebih banyak!':'Hebat! Kamu sudah jadi programmer rover Mars!'); next(e5.level===0?'Level 2 ▶':'Wah, kok bisa? 🤔',e5.level===0?()=>{e5.level=1;e5.pos={x:0,y:1};e5.prog=[];ep5Program();}:ep5Aha,'mint'); } else { speak('Rover berhenti, tapi belum sampai bendera. Coba susun lagi!'); e5.pos={x:0,y:1}; e5.prog=[]; next('Susun lagi 🔁',ep5Program,''); } return; }
    const a=e5.prog[i]; const np={x:e5.pos.x+(a==='r')-(a==='l'), y:e5.pos.y+(a==='d')-(a==='u')}; const el=document.getElementById('p'+i); if(el) el.classList.add('run'); i++;
    if(np.x<0||np.x>4||np.y<0||np.y>3||L.rocks.some(p=>p[0]===np.x&&p[1]===np.y)){ stopLoop(); e5.pos=np.x<0||np.x>4||np.y<0||np.y>3?e5.pos:np; scene.innerHTML=marsScene(); sfx.oops(); scene.classList.add('shake'); setTimeout(()=>scene.classList.remove('shake'),400); speak('Aduh! Rover menabrak. Tidak apa-apa, programmer selalu mencoba lagi. Susun ulang ya!'); e5.pos={x:0,y:1}; e5.prog=[]; next('Susun lagi 🔁',ep5Program,''); return; }
    e5.pos=np; scene.innerHTML=marsScene(); },600);
}
function ep5Aha(){ setStep(3); scene.innerHTML=`<rect width="400" height="300" fill="#1E2A4A"/>${stars()}<circle cx="70" cy="230" r="55" fill="#3FBF7F"/><rect x="40" y="200" width="60" height="40" rx="8" fill="#fff" stroke="#2B2D42" stroke-width="3"/><text x="70" y="227" text-anchor="middle" font-size="20">➡️⬆️➡️</text><path d="M110 200q90-130 200-110" fill="none" stroke="#FFD23F" stroke-width="3" stroke-dasharray="6 8"/><circle cx="330" cy="90" r="50" fill="#E07A5F"/>${rover(330,80,0.55)}<text x="70" y="160" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="14" fill="#fff">Bumi: susun program</text><text x="330" y="160" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="14" fill="#fff">Mars: rover jalan</text>`;
  speak('Rover di Mars benar-benar dijalankan seperti ini. Ilmuwan di Bumi menyusun perintah satu per satu, lalu mengirimnya. Susunan perintah itu namanya program.');
  next('Lanjut ▶',()=>{ speak('Orang yang menyusun program namanya programmer. Dan hari ini, kamu sudah jadi programmer! Pipo sampai di Mars berkat kamu.'); scene.innerHTML=`<rect width="400" height="300" fill="#E07A5F"/><circle cx="330" cy="60" r="20" fill="#FFF3B0"/>${rover(200,200,1)}${pipo(200,150,'yay',0.8)}<text x="200" y="60" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="24" fill="#fff">Pipo di Mars! 🎉</text>`; confetti(); next('Buku Penasaran 📒',()=>finishEpisode(5,{icon:'👩‍🚀',name:'Programmer Mars'},{icon:'🤖',say:'jadilah rover! Minta Ayah atau Ibu menyusun lima perintah: maju, belok kiri, maju... lalu kamu jalankan persis seperti rover.',text:'Jadilah rover! Ayah/Ibu susun 5 perintah (maju, belok kiri...), kamu jalankan persis.'}),'mint'); });
}

hub();
</script>
